<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ORDERLY mascot candidate 1: round coral with pillbox cap -->
  <circle cx="16" cy="18.5" r="11.5" fill="#F47B5A" stroke="#2D2422" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- cap brim -->
  <path d="M8.5 10.5 Q16 6.5 23.5 10.5" fill="none" stroke="#2D2422" stroke-width="1.4" stroke-linecap="round"/>
  <!-- cap body -->
  <path d="M9.5 10.5 L9.5 6.5 Q16 4 22.5 6.5 L22.5 10.5" fill="#33456B" stroke="#2D2422" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- eye -->
  <circle cx="16" cy="17.5" r="5.5" fill="#FFFFFF" stroke="#2D2422" stroke-width="1.2"/>
  <circle cx="16" cy="17.5" r="2.6" fill="#2D2422"/>
  <circle cx="17.5" cy="16" r="1.1" fill="#FFFFFF"/>
  <!-- mouth -->
  <path d="M13.5 23 Q16 25.5 18.5 23" fill="none" stroke="#2D2422" stroke-width="1.2" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="11" cy="20.5" r="1.2" fill="#E85D5D" opacity="0.6"/>
  <circle cx="21" cy="20.5" r="1.2" fill="#E85D5D" opacity="0.6"/>
</svg>