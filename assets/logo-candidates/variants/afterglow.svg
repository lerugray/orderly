<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Afterglow theme, derived from cand-6 -->
  <!-- The same drawing, restructured so the desk can work the eye: the pupil is
       a group to translate, the lid is a rect clipped to the eye, and the mouth
       carries both of its shapes. Every element keeps its own paint, so this
       file still renders unchanged as a plain image with no stylesheet. -->
  <defs>
    <clipPath id="eyeClip-afterglow"><circle cx="16" cy="18" r="5.5"/></clipPath>
  </defs>
  <path d="M16 7 Q21 7 21 12 Q25 14 25 20 Q25 27 16 27 Q7 27 7 20 Q7 14 11 12 Q11 7 16 7 Z" fill="#FF8FA3" stroke="#3D1A22" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="16" cy="18" r="5.5" fill="#FFFFFF"/>
  <g clip-path="url(#eyeClip-afterglow)">
    <g class="m-pupil">
      <circle cx="16" cy="18" r="2.8" fill="#3D1A22"/>
      <path d="M14.5 16 L17.5 16 M16 14.5 L16 17.5" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    </g>
    <rect class="m-lid" x="9.5" y="0" width="13" height="12.5" fill="#FF8FA3" data-lid-close="11"/>
  </g>
  <circle cx="16" cy="18" r="5.5" fill="none" stroke="#3D1A22" stroke-width="1.2"/>
  <path class="m-mouth" d="M13.5 23 Q16 25 18.5 23" fill="none" stroke="#3D1A22" stroke-width="1.1" stroke-linecap="round" data-mouth-smile="M13.5 23 Q16 25 18.5 23" data-mouth-flat="M13.5 23.6 Q16 23.2 18.5 23.6"/>
  <circle cx="11" cy="20.5" r="1.1" fill="#FFB06E" opacity="0.55"/>
  <circle cx="21" cy="20.5" r="1.1" fill="#FFB06E" opacity="0.55"/>
</svg>
