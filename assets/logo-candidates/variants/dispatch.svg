<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dispatch theme, derived from cand-4 -->
  <!-- The same drawing, restructured so the desk can work the eye: the pupil is
       a group to translate, the lid is a rect clipped to the eye, and the mouth
       carries both of its shapes. Every element keeps its own paint, so this
       file still renders unchanged as a plain image with no stylesheet. -->
  <defs>
    <clipPath id="eyeClip-dispatch"><circle cx="14" cy="17" r="5"/></clipPath>
  </defs>
  <path d="M9.5 26 Q5 26 5 20 Q5 11 12 9 Q16 8 20 9 Q27 11 27 20 Q27 26 22.5 26 Q16 28 9.5 26 Z" fill="#FFC857" stroke="#3D2E10" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M20 16 L23 19 L26 16" fill="none" stroke="#3D2E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="23" cy="19.5" r="1" fill="#3D2E10"/>
  <circle cx="14" cy="17" r="5" fill="#FFFFFF"/>
  <g clip-path="url(#eyeClip-dispatch)">
    <g class="m-pupil">
      <circle cx="14" cy="17" r="2.4" fill="#3D2E10"/>
      <circle cx="15.2" cy="15.7" r="1" fill="#FFFFFF"/>
    </g>
    <rect class="m-lid" x="8" y="0" width="12" height="12" fill="#FFC857" data-lid-close="10"/>
  </g>
  <circle cx="14" cy="17" r="5" fill="none" stroke="#3D2E10" stroke-width="1.2"/>
  <path class="m-mouth" d="M11 22.5 Q14 24.5 17 22.5" fill="none" stroke="#3D2E10" stroke-width="1.1" stroke-linecap="round" data-mouth-smile="M11 22.5 Q14 24.5 17 22.5" data-mouth-flat="M11 23.1 Q14 22.7 17 23.1"/>
  <circle cx="10" cy="20" r="1.1" fill="#ED7758" opacity="0.55"/>
</svg>
